worker_processes 1;
pid /run/lion-site/nginx.pid;
error_log /var/log/lion-site/error.log warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30;

    access_log /var/log/lion-site/access.log;
    client_body_temp_path /run/lion-site/client_temp;
    proxy_temp_path /run/lion-site/proxy_temp;
    fastcgi_temp_path /run/lion-site/fastcgi_temp;
    uwsgi_temp_path /run/lion-site/uwsgi_temp;
    scgi_temp_path /run/lion-site/scgi_temp;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript image/svg+xml;

    server {
        listen 18080;
        server_name _;
        root /srv/lion/current;
        index index.html;

        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-cache" always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            try_files $uri $uri/ =404;
        }

        location ~ /\. {
            deny all;
        }
    }
}
