/var/log/lion-site/*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    create 0640
    sharedscripts
    postrotate
        if /usr/bin/systemctl is-active --quiet lion-site.service; then
            /usr/bin/systemctl kill --kill-whom=main --signal=USR1 lion-site.service
        fi
    endscript
}
