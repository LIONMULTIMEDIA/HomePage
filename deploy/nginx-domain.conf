# Loaded by the existing nginx.service; LION stays on its own backend port.
server {
    listen 80;
    listen [::]:80;
    server_name lion-star.vip;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/lion-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://lion-star.vip$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name lion-star.vip;
    ssl_certificate /etc/letsencrypt/live/lion-star.vip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lion-star.vip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
